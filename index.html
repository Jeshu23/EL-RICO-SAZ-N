<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=presentacion.html">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Rico Sazón — Restaurante</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    body { margin: 0; font-family: Georgia, 'Times New Roman', serif; background: #F7EFE2; display: flex; align-items: center; justify-content: center; height: 100vh; }
    .loader { text-align: center; color: #2B1810; }
    .loader h1 { font-size: 2rem; letter-spacing: 2px; margin-bottom: 0.5rem; }
    .loader p { color: #6B4A33; font-size: 1rem; }
    .spinner { width: 40px; height: 40px; border: 4px solid rgba(232,70,31,.2); border-top-color: #E8461F; border-radius: 50%; animation: spin 1s linear infinite; margin: 1rem auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <h1>El Rico Sazón</h1>
    <p>Cargando restaurante…</p>
  </div>
</body>
</html>
