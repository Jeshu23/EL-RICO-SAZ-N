<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="El Rico Sazón">
  <defs>
    <radialGradient id="fondo" cx="42%" cy="32%" r="82%">
      <stop offset="0%"   stop-color="#3B2418"/>
      <stop offset="55%"  stop-color="#26150E"/>
      <stop offset="100%" stop-color="#150B06"/>
    </radialGradient>

    <linearGradient id="oro" x1="10%" y1="0%" x2="90%" y2="100%">
