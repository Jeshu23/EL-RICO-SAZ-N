      C446 371 438 392 424 406
      C426 378 418 364 407 354
      C409 384 414 398 402 419
      C392 437 369 439 357 418
      C343 394 351 366 371 344
      C385 328 395 312 395 292
      C395 278 397 268 400 258 Z"/>

    <g id="tenedor">
      <rect x="-38" y="-152" width="10" height="96" rx="5"/>
      <rect x="-14" y="-152" width="10" height="96" rx="5"/>
      <rect x="10"  y="-152" width="10" height="96" rx="5"/>
      <rect x="34"  y="-152" width="10" height="96" rx="5"/>
      <path d="M-38 -70 H38 V-52 Q38 -34 22 -26 V-6 H-22 V-26 Q-38 -34 -38 -52 Z"/>
      <rect x="-11" y="-10" width="22" height="165" rx="11"/>
    </g>

